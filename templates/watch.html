<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ name }}</title>
<style>
  * { box-sizing: border-box }
  body { font-family: system-ui, -apple-system, sans-serif; background: #111; color: #eee;
         max-width: 960px; margin: 0 auto; padding: 2em 1em }
  h2 { margin: 0 0 .3em; font-size: 1.2em; word-break: break-all }
  a { color: #8cf; text-decoration: none }
  a:hover { text-decoration: underline }
  .crumbs { margin-bottom: 1.2em }
  video { width: 100%; max-height: 80vh; background: #000; border-radius: 8px }
</style>
</head>
<body>
<h2>🎬 {{ name }}</h2>
<p class="crumbs"><a href="/browse/{{ back }}">← 返回目录</a></p>
<video controls preload="metadata" src="/stream/{{ rel }}"></video>
</body>
</html>
